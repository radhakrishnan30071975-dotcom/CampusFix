{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>CampusFix - Login</title>

    <link
        rel="stylesheet"
        href="{% static 'complaints/style.css' %}"
    >

</head>

<body>

<div class="login-container">

    <div class="login-logo">
        CampusFix
    </div>


    <div class="login-card">

        <h1>Welcome Back</h1>

        <p class="center">
            Login to manage your campus complaints
        </p>

        <br>


        {% if form.errors %}

        <div class="error center">
            Username or password is incorrect.
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Username
                </label>

                {{ form.username }}

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                {{ form.password }}

            </div>


            <button
                type="submit"
                class="full-btn"
            >
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
