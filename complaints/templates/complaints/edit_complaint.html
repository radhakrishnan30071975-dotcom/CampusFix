{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>CampusFix - Edit Complaint</title>
    <link rel="stylesheet" href="{% static 'complaints/style.css' %}">
</head>

<body>

<div class="navbar">

    <div class="logo">
        CampusFix
    </div>

    <a class="nav-link" href="{% url 'my_complaints' %}">
        My Complaints
    </a>

</div>


<div class="main">

    <div class="card">

        <h1>Edit Complaint</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Complaint Category
                </label>

                {{ form.category }}

            </div>


            <div class="form-group">

                <label>
                    Location
                </label>

                {{ form.location }}

            </div>


            <div class="form-group">

                <label>
                    Problem Description
                </label>

                {{ form.description }}

            </div>


            <div class="form-group">

                <label>
                    Evidence Image
                </label>

                {{ form.image }}

            </div>


            <div class="actions">

                <button type="submit">
                    Update Complaint
                </button>

                <a
                    class="btn cancel-btn"
                    href="{% url 'my_complaints' %}"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
